<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF6EC"/>
      <stop offset="0.55" stop-color="#FFE9DA"/>
      <stop offset="1" stop-color="#FFF9F2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1040 160) rotate(90) scale(330 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4B45" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FF4B45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(120 330) rotate(-45) scale(300 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE6D5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE6D5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#E5343F" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="340" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <rect width="1280" height="340" fill="url(#glow2)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>

    <!-- decorative diagonals -->
    <g stroke="#F0D6C4" stroke-opacity="0.55">
      <path d="M-40 300 L360 -40" stroke-width="1"/>
      <path d="M20 340 L420 -20" stroke-width="1"/>
      <path d="M860 380 L1240 20" stroke-width="1"/>
    </g>

    <!-- rings behind emblem -->
    <circle cx="1040" cy="168" r="176" stroke="#E5343F" stroke-opacity="0.12" stroke-dasharray="3 9"/>
    <circle cx="1040" cy="168" r="152" stroke="#E5343F" stroke-opacity="0.12"/>
    
  <g opacity="1">
    <circle cx="1040" cy="168" r="124" fill="#FFE6D5"/>
    <circle cx="1040" cy="168" r="118.42" fill="none" stroke="#FF4B45" stroke-width="11.16"/>
    <g transform="translate(970.56,98.56) scale(1.3888)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 30 L67 30 L37 70 L69 70"
            stroke="#1B100E" stroke-width="18"/>
      <path d="M34 30 L67 30 L37 70 L69 70"
            stroke="#FF4B45" stroke-width="13"/>
    </g>
  </g>

    <!-- kicker -->
    <text x="72" y="102" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" letter-spacing="3.4" fill="#FF4B45">ANDROID · JETPACK COMPOSE</text>

    <!-- wordmark -->
    <text x="70" y="181" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#1C1210">ZYComic</text>

    <!-- tagline -->
    <text x="72" y="219" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" fill="#7E5F52">多线路自愈 · 自研 Compose 界面 · 成熟阅读内核</text>

    <!-- chips -->
    <rect x="72.0" y="246" width="113.7" height="32" rx="16.0" fill="#1C1210" fill-opacity="0.04" stroke="#1C1210" stroke-opacity="0.14"/>
  <text x="128.9" y="267.0" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#7E5F52">Android 8.0+</text>
  <rect x="193.7" y="246" width="99.3" height="32" rx="16.0" fill="#1C1210" fill-opacity="0.04" stroke="#1C1210" stroke-opacity="0.14"/>
  <text x="243.4" y="267.0" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#7E5F52">arm64-v8a</text>
  <rect x="301.0" y="246" width="105.0" height="32" rx="16.0" fill="#1C1210" fill-opacity="0.04" stroke="#1C1210" stroke-opacity="0.14"/>
  <text x="353.5" y="267.0" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#7E5F52">Apache-2.0</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="339" rx="27.5" stroke="#E5343F" stroke-opacity="0.35"/>
</svg>
