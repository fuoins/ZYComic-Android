name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体（release/debug）'
        required: true
        default: 'release'
        type: choice
        options:
          - "release"
          - "debug"
      mode:
        description: '构建模式：quick=快速(不压缩/单ABI) final=完美(压缩/全量校验)'
        required: true
        default: 'quick'
        type: choice
        options:
          - "quick"
          - "final"
      abi:
        description: '目标 ABI（quick 模式生效）'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - "arm64-v8a"
          - "armeabi-v7a"
          - "x86_64"
          - "all"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VARIANT: ${{ github.event.inputs.variant }}
      MODE: ${{ github.event.inputs.mode }}
      ABI: ${{ github.event.inputs.abi }}
      MINIFY_ENABLED: ${{ github.event.inputs.mode == 'final' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup SDK (auto install platforms + licenses)
        continue-on-error: true
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 兜底：预装 SDK 若缺少 compileSdk/targetSdk 所需的 android-36 平台，则下载补齐
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "android-36 platform missing, downloading platform-36_r02.zip ..."
            TMP_DIR="$(mktemp -d)"
            curl -fsSL -o "$TMP_DIR/platform-36.zip" "https://dl.google.com/android/repository/platform-36_r02.zip"
            unzip -q "$TMP_DIR/platform-36.zip" -d "$ANDROID_HOME/platforms"
          fi
          test -d "$ANDROID_HOME/platforms/android-36" && echo "android-36 platform ready"

      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_minifyEnabled: "${{ env.MINIFY_ENABLED }}"
          ORG_GRADLE_PROJECT_abi: "${{ env.ABI }}"
        run: |
          TASK=":app:assemble${{ env.VARIANT }}"
          LINT_ARG=""
          if [ "$MODE" = "quick" ]; then LINT_ARG="-x lint -x test"; fi
          ./gradlew $TASK $LINT_ARG --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zycomic-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
