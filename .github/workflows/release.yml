name: Release APK

# 推送 v* 标签时：做 final(R8+shrinkResources) 签名构建，并创建【草稿】GitHub Release、上传已签名 APK。
# 草稿不会自动发布，需在网页手动点 Publish。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动重跑：目标 tag（如 v1.0.0）'
        required: true
        default: 'v1.0.0'
      validate_only:
        description: '仅在所选分支执行发布前单元测试，不创建 Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MINIFY_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validate_only && github.ref || github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup SDK (auto install platforms + licenses)
        continue-on-error: true
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "android-36 platform missing, downloading platform-36_r02.zip ..."
            TMP_DIR="$(mktemp -d)"
            curl -fsSL -o "$TMP_DIR/platform-36.zip" "https://dl.google.com/android/repository/platform-36_r02.zip"
            unzip -q "$TMP_DIR/platform-36.zip" -d "$ANDROID_HOME/platforms"
          fi
          test -d "$ANDROID_HOME/platforms/android-36" && echo "android-36 platform ready"

      - name: Resolve tag
        id: t
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "将发布 $TAG"

      - name: Verify release source and version
        env:
          RELEASE_VERSION: ${{ steps.t.outputs.ver }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          if [ "${{ inputs.validate_only }}" != "true" ]; then
            test "$(git rev-parse "refs/tags/${{ steps.t.outputs.tag }}^{commit}")" = "$SHA"
          fi
          grep -q "versionName = \"$RELEASE_VERSION\"" app/build.gradle.kts
          echo "RELEASE_SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Release source SHA: $SHA"
          grep -E 'version(Code|Name) =' app/build.gradle.kts

      - name: Release unit tests
        env:
          ORG_GRADLE_PROJECT_abi: 'arm64-v8a'
        run: ./gradlew :app:testReleaseUnitTest --console=plain -Dorg.gradle.jvmargs="-Xmx4g" --build-cache

      - name: Decode release keystore
        if: ${{ !inputs.validate_only }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::缺少 KEYSTORE_BASE64 secret"; exit 1; }
          KS="$RUNNER_TEMP/zycomic-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          test -s "$KS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK (final, arm64-v8a)
        if: ${{ !inputs.validate_only }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/zycomic-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_minifyEnabled: '1'
          ORG_GRADLE_PROJECT_abi: 'arm64-v8a'
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --build-cache

      - name: Verify signature and rename APK
        if: ${{ !inputs.validate_only }}
        id: pkg
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -1)"
          echo "构建产物: $APK"
          case "$APK" in
            *-unsigned.apk) echo "::error::产物为未签名 APK，签名配置未生效"; exit 1 ;;
          esac
          APKSIGNER="$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "::error::未找到 apksigner"; exit 1; }
          # 直接执行（不经过管道），签名无效时 apksigner 非零退出会在 set -e 下使本步失败
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          cat "$RUNNER_TEMP/certs.txt"
          # 兼容不同 build-tools 版本的证书摘要输出措辞
          grep -qiE "SHA-256 digest" "$RUNNER_TEMP/certs.txt"
          OUT="ZYComic-${{ steps.t.outputs.ver }}-arm64-v8a.apk"
          cp "$APK" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"
          echo "APK bytes: $(stat -c '%s' "$OUT")"
          sha256sum "$OUT"
          AAPT="$(find "$ANDROID_HOME" -name aapt -type f 2>/dev/null | sort -V | tail -1)"
          test -n "$AAPT" || { echo "::error::未找到 aapt"; exit 1; }
          "$AAPT" dump badging "$OUT" > "$RUNNER_TEMP/apk-badging.txt"
          grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionName='${{ steps.t.outputs.ver }}'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionCode='10'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "^native-code: 'arm64-v8a'$" "$RUNNER_TEMP/apk-badging.txt"
          test -s app/build/outputs/mapping/release/mapping.txt
          {
            echo "### Release verification"
            echo "- Source: $RELEASE_SOURCE_SHA"
            echo "- APK: $OUT"
            echo "- Bytes: $(stat -c '%s' "$OUT")"
            echo "- SHA256: $(sha256sum "$OUT" | cut -d ' ' -f 1)"
            echo "- Signature: apksigner verify passed"
            echo "- R8 mapping: present; MINIFY_ENABLED=$MINIFY_ENABLED"
            grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" "$RUNNER_TEMP/apk-badging.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write release notes
        if: ${{ !inputs.validate_only }}
        run: |
          cat > notes.md <<'EOF'
          ZYComic 3.0.0 正式版

          本次更新（相对 v2.2.0）
          - 新增 Manwa / JM 平台切换，完善 JM 浏览、分类、搜索、详情、相关推荐与评论交互。
          - 完善 JM 登录、注册、邮箱激活、账号恢复和个人资料刷新，隔离不同平台及账号的会话与资料。
          - 接入 JM 在线收藏、收藏夹、观看历史与阅读进度，优化书库搜索、标题和加载状态。
          - 完善 JM 签到状态、补签预览与操作保护。
          - 优化书库和分类工具栏、平台配色、筛选与详情页交互。
          - 优化启动测速、配置预热与版本变更后的重测，完善线路选择、运行时恢复、图片加载及重试策略。

          构建与安装
          - 正式 Release 签名包，开启 R8 代码压缩与资源压缩（shrinkResources）。
          - 版本：3.0.0（versionCode 10），正式包名 com.zycomic.app。
          - 需要 Android 8.0（API 26）或更高版本，仅支持 arm64-v8a（64 位 ARM 设备）。
          - 调试版使用独立包名 com.zycomic.app.dev。

          开源许可
          - 保留上游项目及依赖项各自的版权与许可声明。
          EOF
          echo "notes 已生成"

      - name: Create draft GitHub Release and upload APK
        if: ${{ !inputs.validate_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.t.outputs.tag }}" "${{ steps.pkg.outputs.out }}" \
            --title "ZYComic ${{ steps.t.outputs.tag }}" \
            --notes-file notes.md \
            --draft \
            --target "$RELEASE_SOURCE_SHA"
          echo "草稿 Release 已创建（未发布）"
