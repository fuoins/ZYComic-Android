name: Release APK

# 推送 v* 标签时：做 final(R8+shrinkResources) 签名构建，并创建【草稿】GitHub Release、上传已签名 APK。
# 草稿不会自动发布，需在网页手动点 Publish。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动重跑：目标 tag（如 v1.0.0）'
        required: true
        default: 'v1.0.0'
      prepare_draft:
        description: '从所选分支完整签名构建并创建待审核草稿，不创建 Git tag、不公开发布'
        type: boolean
        default: false
      validate_only:
        description: '仅在所选分支执行发布前单元测试，不创建 Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MINIFY_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.validate_only || inputs.prepare_draft) && github.ref || github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup SDK (auto install platforms + licenses)
        continue-on-error: true
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "android-36 platform missing, downloading platform-36_r02.zip ..."
            TMP_DIR="$(mktemp -d)"
            curl -fsSL -o "$TMP_DIR/platform-36.zip" "https://dl.google.com/android/repository/platform-36_r02.zip"
            unzip -q "$TMP_DIR/platform-36.zip" -d "$ANDROID_HOME/platforms"
          fi
          test -d "$ANDROID_HOME/platforms/android-36" && echo "android-36 platform ready"

      - name: Resolve tag
        id: t
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "构建版本 $TAG（仅创建草稿，不公开发布）"

      - name: Verify release source and version
        env:
          RELEASE_VERSION: ${{ steps.t.outputs.ver }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          if [ "${{ inputs.validate_only }}" != "true" ] && [ "${{ inputs.prepare_draft }}" != "true" ]; then
            test "$(git rev-parse "refs/tags/${{ steps.t.outputs.tag }}^{commit}")" = "$SHA"
          fi
          grep -q "versionName = \"$RELEASE_VERSION\"" app/build.gradle.kts
          echo "RELEASE_SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Release source SHA: $SHA"
          grep -E 'version(Code|Name) =' app/build.gradle.kts

      - name: Apply and verify official formatting
        run: |
          ./gradlew spotlessApply --console=plain
          ./gradlew spotlessCheck --console=plain
          git diff --exit-code

      - name: Isolated JVM contract tests
        run: |
          ./gradlew -p tools/offline-tests prepareHarnessDependencies --console=plain
          for test in tools/test_*.py; do
            echo "===== $test ====="
            # 这些运行时契约用例依赖协程调度时序，2 核 CI 上偶发假失败；
            # 允许重试一次，连续两次失败才判定为真实回归。
            if ! python3 "$test"; then
              echo "::warning::$test failed once, retrying to filter scheduler flakiness"
              python3 "$test"
            fi
          done

      - name: Release unit tests
        env:
          ORG_GRADLE_PROJECT_abi: 'arm64-v8a'
        run: |
          ./gradlew :app:testReleaseUnitTest --console=plain -Dorg.gradle.jvmargs="-Xmx4g" --build-cache
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          reports = [ET.parse(path).getroot() for path in glob.glob('app/build/test-results/testReleaseUnitTest/TEST-*.xml')]
          counts = {key: sum(int(report.get(key, 0)) for report in reports) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('Release unit test totals:', counts)
          assert counts['tests'] > 0 and counts['failures'] == 0 and counts['errors'] == 0
          PY

      - name: Save release unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-unit-test-reports-${{ github.run_id }}
          path: app/build/test-results/testReleaseUnitTest/TEST-*.xml
          if-no-files-found: ignore

      - name: Decode release keystore
        if: ${{ !inputs.validate_only }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::缺少 KEYSTORE_BASE64 secret"; exit 1; }
          KS="$RUNNER_TEMP/zycomic-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          test -s "$KS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed release APK (final, arm64-v8a)
        if: ${{ !inputs.validate_only }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/zycomic-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_minifyEnabled: '1'
          ORG_GRADLE_PROJECT_abi: 'arm64-v8a'
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --build-cache

      - name: Verify signature and rename APK
        if: ${{ !inputs.validate_only }}
        id: pkg
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -1)"
          echo "构建产物: $APK"
          case "$APK" in
            *-unsigned.apk) echo "::error::产物为未签名 APK，签名配置未生效"; exit 1 ;;
          esac
          APKSIGNER="$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "::error::未找到 apksigner"; exit 1; }
          # 直接执行（不经过管道），签名无效时 apksigner 非零退出会在 set -e 下使本步失败
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          cat "$RUNNER_TEMP/certs.txt"
          # 兼容不同 build-tools 版本的证书摘要输出措辞
          grep -qiE "SHA-256 digest" "$RUNNER_TEMP/certs.txt"
          # 与 v4.2.0 正式签名保持一致，保证可覆盖安装而非仅验证任意有效签名。
          grep -qiE 'certificate SHA-256 digest: db5a76b3dee9631dec8e8dd36313267da34a7cc766a36a80c34ab09229ac823d' "$RUNNER_TEMP/certs.txt"
          OUT="ZYComic-${{ steps.t.outputs.ver }}-arm64-v8a.apk"
          cp "$APK" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"
          echo "APK bytes: $(stat -c '%s' "$OUT")"
          sha256sum "$OUT"
          AAPT="$(find "$ANDROID_HOME" -name aapt -type f 2>/dev/null | sort -V | tail -1)"
          test -n "$AAPT" || { echo "::error::未找到 aapt"; exit 1; }
          "$AAPT" dump badging "$OUT" > "$RUNNER_TEMP/apk-badging.txt"
          grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionName='${{ steps.t.outputs.ver }}'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionCode='14'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.zycomic.app'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "^native-code: 'arm64-v8a'$" "$RUNNER_TEMP/apk-badging.txt"
          test -s app/build/outputs/mapping/release/mapping.txt
          {
            echo "### Release verification"
            echo "- Source: $RELEASE_SOURCE_SHA"
            echo "- APK: $OUT"
            echo "- Bytes: $(stat -c '%s' "$OUT")"
            echo "- SHA256: $(sha256sum "$OUT" | cut -d ' ' -f 1)"
            echo "- Signature: apksigner verify passed"
            echo "- R8 mapping: present; MINIFY_ENABLED=$MINIFY_ENABLED"
            grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" "$RUNNER_TEMP/apk-badging.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write release notes
        if: ${{ !inputs.validate_only }}
        run: |
          cat > notes.md <<'EOF'
          ZYComic 5.0.0 待审核构建

          本次更新（相对 v4.2.0）
          - 优化快测与完整测速的两阶段就绪判断，已就绪平台提前放行，剩余项目继续后台检测。
          - 开屏展示实际运行模式，并补充分类、每行漫画格数、平台标签切换及标签增删改操作说明。
          - 禁漫首页安全 GET 请求限次重试，隔离测速请求取消，避免取消其他业务请求。
          - 优化标签筛选、默认顺序、新增后选中与管理页固定标题。
          - 补充启动协调、两阶段测速、首页重试及标签管理回归测试。
          - 恢复哔咔收藏页独立刷新指示器及加载中可重新刷新行为，删除操作进行时仍禁止重复刷新。

          构建与安装
          - 正式 Release 签名包，开启 R8 代码压缩与资源压缩（shrinkResources）。
          - 版本：5.0.0（versionCode 14），正式包名 com.zycomic.app。
          - 需要 Android 8.0（API 26）或更高版本，仅支持 arm64-v8a（64 位 ARM 设备）。
          - 调试版使用独立包名 com.zycomic.app.dev。

          开源许可
          - 保留上游项目及依赖项各自的版权与许可声明。
          EOF
          echo "notes 已生成"

      - name: Guard branch-only draft mode
        if: ${{ inputs.prepare_draft && !inputs.validate_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$DRAFT_TAG" > "$RUNNER_TEMP/matching-tags.json"
          python3 - "$RUNNER_TEMP/matching-tags.json" "$DRAFT_TAG" <<'PYGUARD'
          import json, sys
          refs = json.load(open(sys.argv[1]))
          assert not any(r['ref'] == 'refs/tags/' + sys.argv[2] for r in refs), '目标 tag 已存在；停止以避免修改现有版本'
          PYGUARD

      - name: Create draft GitHub Release and upload APK
        if: ${{ !inputs.validate_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.t.outputs.tag }}" "${{ steps.pkg.outputs.out }}" \
            --title "ZYComic ${{ steps.t.outputs.tag }}" \
            --notes-file notes.md \
            --draft \
            --target "$RELEASE_SOURCE_SHA"
          echo "草稿 Release 已创建（未发布）"

      - name: Verify draft remains private and tag absent
        if: ${{ inputs.prepare_draft && !inputs.validate_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$DRAFT_TAG" --json isDraft,targetCommitish,url > "$RUNNER_TEMP/draft.json"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$DRAFT_TAG" > "$RUNNER_TEMP/matching-tags.json"
          python3 - "$RUNNER_TEMP/draft.json" "$RUNNER_TEMP/matching-tags.json" "$DRAFT_TAG" "$RELEASE_SOURCE_SHA" <<'PYGUARD'
          import json, sys
          release = json.load(open(sys.argv[1]))
          assert release['isDraft'] is True, 'Release 必须保持草稿'
          assert release['targetCommitish'] == sys.argv[4], '草稿目标必须是已验证的源码 commit'
          assert not any(r['ref'] == 'refs/tags/' + sys.argv[3] for r in json.load(open(sys.argv[2]))), '禁止创建 Git tag'
          print('Verified: draft only, exact source SHA, no Git tag:', release['url'])
          PYGUARD
